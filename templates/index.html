<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Claviculário IFSP Bragança Paulista</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>

    <div class="app">

        <header class="topo">

            <div class="logo-area">
                <img src="../static/images/logoIFSPBRA.png" alt="IFSP Bragança Paulista" class="logo">
                <div class="titulo-area">
                    <h1>Sistema de Controle de Chaves</h1>
                </div>
            </div>

            <div class="controle-area">
                <div class="inputs-area">
                    <input type="text" class="input" id="idFuncionario" placeholder="Prontuário do Servidor" autofocus>
                    <input type="text" class="input" id="codigoChave" placeholder="Código da Chave">

                    <div id="mensagemErro" class="mensagem-erro"></div>
                </div>

                <div class="botoes">
                    <button class="btn retirar" onclick="registrar('RETIRADA')">RETIRAR</button>
                    <button class="btn devolver" onclick="registrar('DEVOLUCAO')">DEVOLVER</button>
                </div>

            </div>

        </header>

        <main class="conteudo">

            <div class="blocos">

                <section class="bloco bloco-a">
                    <div class="bloco-titulo">PRÉDIO A</div>
                    <div id="blocoA"></div>
                </section>

                <section class="bloco bloco-b">
                    <div class="bloco-titulo">PRÉDIO B</div>
                    <div id="blocoB"></div>
                </section>

            </div>

        </main>

    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <h2>Informações da Chave</h2>
            <div id="modalConteudo"></div>
            <button class="fechar-modal" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <div id="feedbackOverlay" class="feedback-overlay"></div>
    
    <div id="feedback" class="feedback">
        <span id="feedbackTexto"></span>
    </div>

    <div id="confirmacaoDevolucaoOverlay" class="confirmacao-overlay hidden" role="presentation">
        <section class="confirmacao-modal" role="dialog" aria-modal="true" aria-labelledby="confirmacaoDevolucaoTitulo">
            <h2 id="confirmacaoDevolucaoTitulo">Chave já emprestada</h2>
            <p>A chave <strong id="confirmacaoChave"></strong> está emprestada. Deseja registrar a devolução?</p>
            <p class="confirmacao-contagem">Esta janela fechará em <span id="confirmacaoContagem">5</span>s.</p>
            <div class="confirmacao-acoes">
                <button type="button" class="btn devolver" onclick="confirmarDevolucao()">DEVOLVER</button>
                <button type="button" class="btn fechar-confirmacao" onclick="fecharConfirmacaoDevolucao()">FECHAR</button>
            </div>
        </section>
    </div>


    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("msg") === "sem_dados") {
            alert("Não há novos registros para exportar.");
        }
    </script>
    <script src="../static/script.js"></script>
</body>

</html>
